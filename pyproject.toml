[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-collector"
version = "0.1.0"
description = "Self-healing US equity market data collector"
requires-python = ">=3.12"
dependencies = [
    "pyarrow",
    "httpx",
    "pandas_market_calendars",
]

[project.optional-dependencies]
crosscheck = ["yfinance"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
collector = "collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:collector.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # function call in default argument -- not used here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["collector"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
