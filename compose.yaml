# tick-collector — Dockge / Unraid stack
#
# Dockge edits THIS file and treats it as the stack's source of truth, so
# everything you need to change lives here, in `environment:` below. Nothing is
# read from a `.env` in the stack directory: Dockge manages that directory and a
# `.env` placed there can be rewritten or cleared, which would silently leave the
# collector running with no API key — healthy-looking and collecting nothing.
#
# The API key therefore comes from a file OUTSIDE the stack directory. Create it
# once and nothing will touch it again:
#
#   mkdir -p /mnt/user/appdata/tick-collector
#   printf '%s' 'your-key-here' > /mnt/user/appdata/tick-collector/api_key
#   chmod 600 /mnt/user/appdata/tick-collector/api_key
#   chown 99:100 /mnt/user/appdata/tick-collector/api_key
#
# Then press Deploy. See DEPLOY.md for the full walkthrough.

services:
  collector:
    build:
      context: .
      target: app
      args:
        # Must match the owner of the data share below. Unraid's shares are
        # nobody:users = 99:100.
        APP_UID: "99"
        APP_GID: "100"
    image: tick-collector:0.1.0
    container_name: tick-collector
    restart: unless-stopped

    environment:
      # Where the collector reads the API key from. The file lives outside this
      # stack directory on purpose -- see the note at the top.
      MASSIVE_API_KEY_FILE: /run/secrets/api_key
      # Log timestamps only. The scheduler's own timezone comes from
      # config/collector.toml so the two cannot drift apart.
      TZ: America/New_York
      # INFO is right for normal running; DEBUG logs one line per API call.
      COLLECTOR_LOG_LEVEL: INFO
      COLLECTOR_DATA_ROOT: /data
      COLLECTOR_CONFIG: /app/config/collector.toml
      # Webhook for hard failures and recoveries. Works with Slack, Discord, ntfy
      # and most self-hosted receivers. Uncomment and paste your URL.
      # COLLECTOR_ALERT_WEBHOOK: https://discord.com/api/webhooks/...

    volumes:
      # The API key, read-only. Create it first (see the note at the top), or the
      # container comes up idle with a warning in the log.
      - /mnt/user/appdata/tick-collector/api_key:/run/secrets/api_key:ro

      # Bulk data on the array. published/, staging/, quarantine/, state/, work/
      # and logs/ all live under here; they must stay on ONE filesystem or the
      # atomic publish stops being atomic, which `collector init` refuses to
      # start without.
      - /mnt/user/quant-data:/data

      # Thresholds, universe size, extended hours, compression level, schedule
      # timezone. Read-only: the collector never writes its own config.
      - ./config:/app/config:ro

      # Backups. Uncomment, and set [backup] directory = "/backups" in
      # config/collector.toml, to enable the nightly backup job. Use a different
      # share from the data above -- a backup on the same disk is not a backup.
      # - /mnt/user/backups/tick-collector:/backups

    # Minute-day batches are small; this is ample and keeps a runaway job from
    # pressuring the rest of the server.
    mem_limit: 2g
    # The scheduler stops cleanly on SIGTERM, finishing the batch in flight
    # rather than leaving a partial file behind.
    stop_grace_period: 60s

    # Unhealthy when status.json is stale or the last run hard-failed. Dockge
    # shows this in the stack list, so a silent failure becomes visible without
    # reading logs. start-period is generous because the startup catch-up pass
    # begins collecting straight away.
    healthcheck:
      test: ["CMD", "python", "-m", "collector", "healthcheck"]
      interval: 5m
      timeout: 30s
      start_period: 5m
      retries: 3

    # Dockge reads container logs from the json-file driver, so keep them bounded
    # — the Unraid cache drive fills otherwise.
    logging:
      driver: json-file
      options:
        max-size: 16m
        max-file: "5"

    labels:
      org.opencontainers.image.title: tick-collector
      org.opencontainers.image.description: Self-healing US equity market data collector
